services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: gspace
      POSTGRES_USER: gspace
      POSTGRES_PASSWORD: ${GSPACE_DB_PASSWORD:-gspace_dev_only}
    volumes:
      - gspace_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gspace -d gspace"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  gspace_postgres:
